[package]
name = "derbe-shared"
version = "0.1.0"
edition = "2021"

[features]
with_sqlx = ["sqlx"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.43", features = ["serde", "alloc"] }
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "migrate",
    "postgres",
    "chrono",
    "bigdecimal",
], optional = true }
