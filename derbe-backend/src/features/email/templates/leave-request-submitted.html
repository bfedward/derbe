<p style="margin:0 0 16px;"><strong>{{employee_name}}</strong> has requested leave and is waiting for your decision.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%; border-collapse:collapse; margin:0 0 20px;">
  <tr><td style="padding:6px 12px 6px 0; color:#71717a; width:100px;">Leave type</td><td style="padding:6px 0;">{{leave_type}}</td></tr>
  <tr><td style="padding:6px 12px 6px 0; color:#71717a;">From</td><td style="padding:6px 0;">{{date_from}}</td></tr>
  <tr><td style="padding:6px 12px 6px 0; color:#71717a;">To</td><td style="padding:6px 0;">{{date_to}}</td></tr>
  <tr><td style="padding:6px 12px 6px 0; color:#71717a;">Duration</td><td style="padding:6px 0;">{{duration}}</td></tr>
  <tr><td style="padding:6px 12px 6px 0; color:#71717a; vertical-align:top;">Notes</td><td style="padding:6px 0;">{{notes}}</td></tr>
</table>
<a href="{{link}}" style="display:inline-block; padding:10px 18px; background-color:#18181b; color:#ffffff; text-decoration:none; border-radius:6px; font-weight:bold;">Review request</a>
