<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px; background-color:#ffffff; border-radius:8px;">
          <tr>
            <td style="padding:24px 24px 0; font-family:Arial, Helvetica, sans-serif; font-size:20px; font-weight:bold; color:#18181b;">
              Derbe
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px 24px; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.5; color:#27272a;">
              {{content}}
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0; font-family:Arial, Helvetica, sans-serif; font-size:12px; color:#71717a;">
          You received this email because of activity in Derbe.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
