[package]
name = "derbe-frontend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yew = { version = "0.21.0", features = ["csr"]}
yew-router = "0.18.0"
gloo = "0.11.0"
serde = { version = "1.0.200", features = ["derive"]}
wasm-bindgen = "0.2.92"
web-sys = { version = "0.3.69", features = ["HtmlInputElement", "HtmlSelectElement" ] }
wasm-bindgen-futures = "0.4.42"
yewdux = "0.10.0"
thiserror = "1.0.59"
reqwasm = "0.5.0"
serde_json = "1.0.116"
stylist = { version = "0.13.0", features = ["yew"] }
chrono = { version = "0.4.38", features = ["serde"] }
serde_with = { version = "3.8.1", features = ["time_0_3"] }