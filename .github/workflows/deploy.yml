name: Deploy

on:
  workflow_dispatch:
    inputs:
      skip_frontend_build:
        description: 'Skip frontend build and redeploy its :frontend-latest image'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_backend_build:
        description: 'Skip backend build and redeploy its :backend-latest image'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      confirm_deploy:
        description: 'Confirm production deployment'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: derbe
  SERVER_USER: ${{ vars.SERVER_USER || 'deploy' }}

jobs:
  build_backend:
    name: Build backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    if: github.event.inputs.confirm_deploy == 'true' && github.event.inputs.skip_backend_build != 'true'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.PROD_DOCKER_USERNAME }}
          password: ${{ secrets.PROD_DOCKER_PASSWORD }}

      - name: Generate backend image tag
        id: tag
        run: echo "image_tag=backend-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.PROD_DOCKER_USERNAME }}/${{ vars.PROD_DOCKER_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
            ${{ secrets.PROD_DOCKER_USERNAME }}/${{ vars.PROD_DOCKER_REPOSITORY }}:backend-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    if: github.event.inputs.confirm_deploy == 'true' && github.event.inputs.skip_frontend_build != 'true'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.PROD_DOCKER_USERNAME }}
          password: ${{ secrets.PROD_DOCKER_PASSWORD }}

      - name: Generate frontend image tag
        id: tag
        run: echo "image_tag=frontend-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.PROD_DOCKER_USERNAME }}/${{ vars.PROD_DOCKER_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
            ${{ secrets.PROD_DOCKER_USERNAME }}/${{ vars.PROD_DOCKER_REPOSITORY }}:frontend-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy
    needs: [build_backend, build_frontend]
    if: |
      always() &&
      github.event.inputs.confirm_deploy == 'true' &&
      (needs.build_backend.result == 'success' || needs.build_backend.result == 'skipped') &&
      (needs.build_frontend.result == 'success' || needs.build_frontend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH with a pinned host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSHCONF
          Host derbe
            HostName $SERVER_IP
            User $SERVER_USER
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            BatchMode yes
          SSHCONF
          sed -i 's/^ *//' ~/.ssh/config

      - name: Copy deploy files
        env:
          DERBE_DOMAIN: ${{ vars.DERBE_DOMAIN }}
        run: |
          ssh derbe "mkdir -p ~/$DEPLOY_DIR"
          sed "s/__DERBE_DOMAIN__/$DERBE_DOMAIN/g" nginx.prod.conf > /tmp/nginx.prod.conf
          sed "s/__DERBE_DOMAIN__/$DERBE_DOMAIN/g" nginx.prod.bootstrap.conf > /tmp/nginx.prod.bootstrap.conf
          scp docker-compose.prod.yml /tmp/nginx.prod.conf /tmp/nginx.prod.bootstrap.conf scripts/backup-db.sh "derbe:~/$DEPLOY_DIR/"

      - name: Write server .env (secrets over stdin)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOCKER_USERNAME: ${{ secrets.PROD_DOCKER_USERNAME }}
          DOCKER_REPOSITORY: ${{ vars.PROD_DOCKER_REPOSITORY }}
          DERBE_DOMAIN: ${{ vars.DERBE_DOMAIN }}
          # A skipped build keeps running its previous :<service>-latest image.
          BACKEND_IMAGE_TAG: ${{ needs.build_backend.outputs.image_tag || 'backend-latest' }}
          FRONTEND_IMAGE_TAG: ${{ needs.build_frontend.outputs.image_tag || 'frontend-latest' }}
        run: |
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "DOCKER_USERNAME=$DOCKER_USERNAME"
            echo "DOCKER_REPOSITORY=$DOCKER_REPOSITORY"
            echo "DERBE_DOMAIN=$DERBE_DOMAIN"
            echo "BACKEND_IMAGE_TAG=$BACKEND_IMAGE_TAG"
            echo "FRONTEND_IMAGE_TAG=$FRONTEND_IMAGE_TAG"
          } | ssh derbe "umask 077 && cat > ~/$DEPLOY_DIR/.env.new"

      - name: Pull, swap containers, wire nginx and TLS
        env:
          DOCKER_PASSWORD: ${{ secrets.PROD_DOCKER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.PROD_DOCKER_USERNAME }}
          DERBE_DOMAIN: ${{ vars.DERBE_DOMAIN }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | ssh derbe "docker login -u '$DOCKER_USERNAME' --password-stdin"
          ssh derbe bash -s -- "$DEPLOY_DIR" "$DERBE_DOMAIN" "$LETSENCRYPT_EMAIL" <<'REMOTE'
          set -euo pipefail
          deploy_dir="$HOME/$1"; domain="$2"; email="$3"
          cd "$deploy_dir"

          # Keep the previous env so a rollback is one command.
          [ -f .env ] && cp .env .env.previous
          mv .env.new .env

          # Pull first, swap after: no downtime window while images download.
          docker compose -f docker-compose.prod.yml --env-file .env pull backend frontend
          docker compose -f docker-compose.prod.yml --env-file .env up -d db
          docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps backend frontend

          # First run: HTTP only config, then certbot, then final TLS config.
          cert="/etc/letsencrypt/live/$domain/fullchain.pem"
          if ! sudo test -f "$cert"; then
            ln -sf "$deploy_dir/nginx.prod.bootstrap.conf" "$deploy_dir/nginx.active.conf"
            sudo nginx -t && sudo systemctl reload nginx
            sudo certbot certonly --nginx -d "$domain" -m "$email" --agree-tos --non-interactive
          fi
          ln -sf "$deploy_dir/nginx.prod.conf" "$deploy_dir/nginx.active.conf"
          sudo nginx -t && sudo systemctl reload nginx

          # Only dangling layers. Never -a: tagged images stay for rollback.
          docker image prune -f
          REMOTE

      - name: Smoke test
        env:
          DERBE_DOMAIN: ${{ vars.DERBE_DOMAIN }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "https://$DERBE_DOMAIN/api/health" >/dev/null && curl -fsS "https://$DERBE_DOMAIN/" >/dev/null; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          ssh derbe "cd ~/$DEPLOY_DIR && docker compose -f docker-compose.prod.yml --env-file .env ps && docker compose -f docker-compose.prod.yml --env-file .env logs --tail 80 backend"
          exit 1
